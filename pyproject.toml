[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forgel-code"
version = "0.1.0"
description = "Thin console client for Forgel over the engine's machine-readable commands"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Forgel" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
forgel-code = "forgel_code.cli:main"

[tool.setuptools]
packages = ["forgel_code"]
